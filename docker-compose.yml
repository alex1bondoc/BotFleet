services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       botfleet
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres/botfleet
      RABBITMQ_URL: amqp://guest:guest@rabbitmq/
      BOTS_DIR:     /tmp/bots
      HISTORY_DIR:  /tmp/games
    volumes:
      - bots_data:/tmp/bots
      - games_data:/tmp/games
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres/botfleet
      RABBITMQ_URL: amqp://guest:guest@rabbitmq/
      HISTORY_DIR:  /tmp/games
    volumes:
      - bots_data:/tmp/bots
      - games_data:/tmp/games
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  bots_data:
  games_data:
